<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>An Nam POS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#222;
}

header{
    height:64px;
    background:#8b2f2f;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.header-time{
    font-size:13px;
    opacity:.9;
}

nav{
    background:white;
    display:flex;
    overflow-x:auto;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:64px;
    z-index:19;
}

nav button{
    border:0;
    background:white;
    padding:15px 18px;
    font-size:14px;
    white-space:nowrap;
    cursor:pointer;
}

nav button.active{
    color:#8b2f2f;
    font-weight:700;
    border-bottom:3px solid #8b2f2f;
}

.page{
    display:none;
    padding:15px;
}

.page.active{
    display:block;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    margin-bottom:15px;
}

h2{
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:12px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:14px;
}

.categories button{
    border:1px solid #ddd;
    background:white;
    border-radius:20px;
    padding:9px 14px;
    white-space:nowrap;
}

.categories button.active{
    background:#8b2f2f;
    color:white;
    border-color:#8b2f2f;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.product{
    background:white;
    border:1px solid #e7e7e7;
    border-radius:12px;
    padding:12px;
    min-height:100px;
    cursor:pointer;
}

.product-name{
    font-weight:700;
    line-height:1.35;
    margin-bottom:8px;
}

.price{
    color:#b42d2d;
    font-weight:800;
}

.sale-layout{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:15px;
}

.cart-item{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
}

.qty button{
    width:30px;
    height:30px;
    border:0;
    border-radius:7px;
    font-size:18px;
}

.remove{
    color:#c62828;
    border:0;
    background:none;
}

.input{
    width:100%;
    border:1px solid #ddd;
    padding:11px;
    border-radius:9px;
    margin-top:9px;
    font-size:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    gap:10px;
}

.total{
    font-size:22px;
    font-weight:800;
    color:#b32626;
}

.pay-btn{
    width:100%;
    background:#198754;
    color:white;
    border:0;
    padding:15px;
    border-radius:10px;
    font-size:17px;
    font-weight:700;
    margin-top:15px;
}

.empty{
    text-align:center;
    color:#888;
    padding:30px 10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    text-align:left;
    padding:11px 7px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.action-btn{
    border:0;
    padding:7px 9px;
    border-radius:6px;
    margin:2px;
}

.primary{
    background:#8b2f2f;
    color:white;
}

.danger{
    background:#ffe8e8;
    color:#b00020;
}

.green{
    color:#16803c;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.stat small{
    color:#777;
}

.stat strong{
    display:block;
    margin-top:8px;
    font-size:20px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:15px;
    padding:18px;
}

.receipt{
    font-family:monospace;
}

.receipt h2{
    text-align:center;
}

.receipt-center{
    text-align:center;
    margin-bottom:15px;
}

.receipt-line{
    border-top:1px dashed #555;
    margin:12px 0;
}

.close-btn{
    width:100%;
    border:0;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}

@media(max-width:800px){
    .sale-layout{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }
}

@media(min-width:900px){
    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .page{
        max-width:1400px;
        margin:auto;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <div class="logo">AN NAM POS</div>
        <div class="header-time" id="clock"></div>
    </div>
    <div>Quản lý bán hàng</div>
</header>

<nav>
    <button class="active" onclick="showPage('sale',this)">🛒 Bán hàng</button>
    <button onclick="showPage('orders',this)">🧾 Hóa đơn</button>
    <button onclick="showPage('products',this)">🍜 Món ăn</button>
    <button onclick="showPage('customers',this)">👥 Khách hàng</button>
    <button onclick="showPage('report',this)">📊 Doanh thu</button>
</nav>

<!-- BÁN HÀNG -->

<section id="sale" class="page active">

<div class="sale-layout">

<div>
    <input
        class="search"
        id="searchProduct"
        placeholder="🔍 Tìm món..."
        oninput="renderProducts()"
    >

    <div class="categories" id="categories"></div>

    <div class="product-grid" id="productGrid"></div>
</div>

<div class="card">
    <h2>Đơn hàng</h2>

    <div id="cart"></div>

    <input
        class="input"
        id="customerPhone"
        placeholder="Số điện thoại khách"
    >

    <input
        class="input"
        id="customerName"
        placeholder="Tên khách (không bắt buộc)"
    >

    <input
        class="input"
        id="discount"
        type="number"
        min="0"
        placeholder="Giảm giá (đ)"
        oninput="renderCart()"
    >

    <input
        class="input"
        id="note"
        placeholder="Ghi chú đơn hàng"
    >

    <div class="row">
        <span>Tạm tính</span>
        <strong id="subtotal">0đ</strong>
    </div>

    <div class="row">
        <span>Giảm giá</span>
        <strong id="discountView">0đ</strong>
    </div>

    <div class="row">
        <span>Khách cần trả</span>
        <span class="total" id="grandTotal">0đ</span>
    </div>

    <button class="pay-btn" onclick="checkout()">
        THANH TOÁN
    </button>
</div>

</div>

</section>

<!-- HÓA ĐƠN -->

<section id="orders" class="page">

<div class="card">

<h2>Danh sách hóa đơn</h2>

<input
    class="search"
    id="searchOrder"
    placeholder="Tìm mã hóa đơn hoặc SĐT..."
    oninput="renderOrders()"
>

<div style="overflow:auto">

<table>
<thead>
<tr>
<th>Mã</th>
<th>Thời gian</th>
<th>Khách</th>
<th>Tổng tiền</th>
<th></th>
</tr>
</thead>

<tbody id="orderTable"></tbody>

</table>

</div>

</div>

</section>

<!-- MÓN ĂN -->

<section id="products" class="page">

<div class="card">

<h2>Quản lý món</h2>

<input class="input" id="newName" placeholder="Tên món">

<input class="input" id="newPrice" type="number" placeholder="Giá bán">

<select class="input" id="newCategory">
<option>Cơm rang</option>
<option>Mỳ cay</option>
<option>Mỳ trộn</option>
<option>Ăn vặt</option>
</select>

<button class="pay-btn" onclick="addProduct()">
+ THÊM MÓN
</button>

</div>

<div class="card">

<div style="overflow:auto">

<table>
<thead>
<tr>
<th>Tên món</th>
<th>Nhóm</th>
<th>Giá</th>
<th></th>
</tr>
</thead>

<tbody id="productTable"></tbody>

</table>

</div>

</div>

</section>

<!-- KHÁCH HÀNG -->

<section id="customers" class="page">

<div class="card">

<h2>Khách hàng</h2>

<input
    class="search"
    id="searchCustomer"
    placeholder="Tìm SĐT hoặc tên khách..."
    oninput="renderCustomers()"
>

<div style="overflow:auto">

<table>

<thead>
<tr>
<th>Khách hàng</th>
<th>SĐT</th>
<th>Số đơn</th>
<th>Đã mua</th>
</tr>
</thead>

<tbody id="customerTable"></tbody>

</table>

</div>

</div>

</section>

<!-- DOANH THU -->

<section id="report" class="page">

<h2>Tổng quan bán hàng</h2>

<div class="stats">

<div class="stat">
<small>Doanh thu hôm nay</small>
<strong id="todayRevenue">0đ</strong>
</div>

<div class="stat">
<small>Đơn hôm nay</small>
<strong id="todayOrders">0</strong>
</div>

<div class="stat">
<small>Tổng doanh thu</small>
<strong id="allRevenue">0đ</strong>
</div>

</div>

<div class="card" style="margin-top:15px">

<h2>Món bán chạy</h2>

<div id="bestSeller"></div>

</div>

</section>

<!-- MODAL HÓA ĐƠN -->

<div class="modal" id="receiptModal">

<div class="modal-box">

<div id="receiptContent"></div>

<button class="close-btn" onclick="closeReceipt()">
Đóng
</button>

</div>

</div>

<script>

/* ==============================
   DỮ LIỆU
================================ */

const defaultProducts = [

{id:1,name:"Cơm Dưa Bò",price:45000,category:"Cơm rang"},
{id:2,name:"Cơm Thịt Viên",price:40000,category:"Cơm rang"},
{id:3,name:"Cơm Thịt Xiên Nướng",price:45000,category:"Cơm rang"},
{id:4,name:"Cơm Gà Xối Mỡ",price:55000,category:"Cơm rang"},
{id:5,name:"Cơm Gà Nướng",price:55000,category:"Cơm rang"},
{id:6,name:"Cơm Bê Xào Sả Ớt",price:55000,category:"Cơm rang"},

{id:7,name:"Mỳ Cay Xúc Xích",price:40000,category:"Mỳ cay"},
{id:8,name:"Mỳ Cay Bò Mỹ",price:45000,category:"Mỳ cay"},
{id:9,name:"Mỳ Cay Đùi Gà",price:50000,category:"Mỳ cay"},
{id:10,name:"Mỳ Cay Bò Ta",price:50000,category:"Mỳ cay"},

{id:11,name:"Mỳ Trộn Xúc Xích",price:40000,category:"Mỳ trộn"},
{id:12,name:"Mỳ Trộn Lạp Sườn Hà Khẩu",price:40000,category:"Mỳ trộn"},
{id:13,name:"Mỳ Trộn Trứng Thịt Viên",price:45000,category:"Mỳ trộn"},
{id:14,name:"Mỳ Trộn Trứng Thịt Xiên",price:45000,category:"Mỳ trộn"},

{id:15,name:"Xúc Xích",price:10000,category:"Ăn vặt"},
{id:16,name:"Lạp Sườn Hà Khẩu",price:15000,category:"Ăn vặt"},
{id:17,name:"Đùi Gà Rán",price:35000,category:"Ăn vặt"},
{id:18,name:"Đùi Gà Sốt Phomai",price:40000,category:"Ăn vặt"},
{id:19,name:"Khoai Tây Lắc Phomai",price:35000,category:"Ăn vặt"},
{id:20,name:"Phomai Que 5c",price:35000,category:"Ăn vặt"},
{id:21,name:"Nem Chua Rán 5c",price:35000,category:"Ăn vặt"},
{id:22,name:"Nem Phomai 5c",price:40000,category:"Ăn vặt"}

];

let products =
JSON.parse(localStorage.getItem("annam_products"))
|| defaultProducts;

let orders =
JSON.parse(localStorage.getItem("annam_orders"))
|| [];

let cart=[];

let currentCategory="Tất cả";


/* ==============================
   TIỆN ÍCH
================================ */

function money(n){
    return Number(n || 0).toLocaleString("vi-VN")+"đ";
}

function save(){
    localStorage.setItem(
        "annam_products",
        JSON.stringify(products)
    );

    localStorage.setItem(
        "annam_orders",
        JSON.stringify(orders)
    );
}


/* ==============================
   MENU TRANG
================================ */

function showPage(id,btn){

    document
    .querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

    document
    .querySelectorAll("nav button")
    .forEach(b=>b.classList.remove("active"));

    document
    .getElementById(id)
    .classList.add("active");

    btn.classList.add("active");

    if(id==="orders") renderOrders();

    if(id==="products") renderProductTable();

    if(id==="customers") renderCustomers();

    if(id==="report") renderReport();
}


/* ==============================
   DANH MỤC
================================ */

function renderCategories(){

    const cats=[
        "Tất cả",
        ...new Set(products.map(p=>p.category))
    ];

    document.getElementById("categories").innerHTML =
    cats.map(c=>`
        <button
        class="${c===currentCategory?"active":""}"
        onclick="selectCategory('${c}')">
        ${c}
        </button>
    `).join("");
}

function selectCategory(cat){

    currentCategory=cat;

    renderCategories();

    renderProducts();
}


/* ==============================
   SẢN PHẨM
================================ */

function renderProducts(){

    const q=
    document.getElementById("searchProduct")
    .value
    .toLowerCase();

    const list=products.filter(p=>{

        const categoryOK=
        currentCategory==="Tất cả"
        || p.category===currentCategory;

        const searchOK=
        p.name.toLowerCase().includes(q);

        return categoryOK && searchOK;
    });

    document.getElementById("productGrid").innerHTML =
    list.length
    ?
    list.map(p=>`
        <div class="product"
        onclick="addToCart(${p.id})">

            <div class="product-name">
            ${p.name}
            </div>

            <div class="price">
            ${money(p.price)}
            </div>

        </div>
    `).join("")
    :
    `<div class="empty">Không tìm thấy món.</div>`;
}


/* ==============================
   GIỎ HÀNG
================================ */

function addToCart(id){

    const product=
    products.find(p=>p.id===id);

    const item=
    cart.find(i=>i.id===id);

    if(item){
        item.qty++;
    }
    else{
        cart.push({
            ...product,
            qty:1
        });
    }

    renderCart();
}

function changeQty(id,amount){

    const item=
    cart.find(i=>i.id===id);

    if(!item) return;

    item.qty+=amount;

    if(item.qty<=0){
        cart=
        cart.filter(i=>i.id!==id);
    }

    renderCart();
}

function removeCart(id){

    cart=
    cart.filter(i=>i.id!==id);

    renderCart();
}

function renderCart(){

    const box=
    document.getElementById("cart");

    if(!cart.length){

        box.innerHTML=
        `<div class="empty">
        Chưa có món nào trong đơn
        </div>`;
    }
    else{

        box.innerHTML=
        cart.map(i=>`

        <div class="cart-item">

            <div class="cart-top">

                <strong>${i.name}</strong>

                <button
                class="remove"
                onclick="removeCart(${i.id})">
                Xóa
                </button>

            </div>

            <div class="qty">

                <button
                onclick="changeQty(${i.id},-1)">
                −
                </button>

                <strong>${i.qty}</strong>

                <button
                onclick="changeQty(${i.id},1)">
                +
                </button>

                <span style="margin-left:auto">
                ${money(i.price*i.qty)}
                </span>

            </div>

        </div>

        `).join("");
    }

    const subtotal=
    cart.reduce(
        (sum,i)=>sum+i.price*i.qty,
        0
    );

    let discount=
    Number(
        document.getElementById("discount").value
    ) || 0;

    if(discount<0) discount=0;

    if(discount>subtotal)
        discount=subtotal;

    const total=
    subtotal-discount;

    document.getElementById("subtotal")
    .textContent=money(subtotal);

    document.getElementById("discountView")
    .textContent=money(discount);

    document.getElementById("grandTotal")
    .textContent=money(total);
}


/* ==============================
   THANH TOÁN
================================ */

function checkout(){

    if(!cart.length){

        alert("Chưa có món trong đơn.");

        return;
    }

    const subtotal=
    cart.reduce(
        (s,i)=>s+i.price*i.qty,
        0
    );

    let discount=
    Number(
        document.getElementById("discount").value
    ) || 0;

    discount=
    Math.max(
        0,
        Math.min(discount,subtotal)
    );

    const total=
    subtotal-discount;

    const order={

        id:"AN"+Date.now(),

        time:new Date().toISOString(),

        customerName:
        document.getElementById("customerName")
        .value.trim(),

        phone:
        document.getElementById("customerPhone")
        .value.trim(),

        note:
        document.getElementById("note")
        .value.trim(),

        items:cart.map(i=>({...i})),

        subtotal,

        discount,

        total
    };

    orders.unshift(order);

    save();

    showReceipt(order);

    cart=[];

    document.getElementById("customerName").value="";
    document.getElementById("customerPhone").value="";
    document.getElementById("discount").value="";
    document.getElementById("note").value="";

    renderCart();
}


/* ==============================
   HÓA ĐƠN
================================ */

function showReceipt(order){

    const date=
    new Date(order.time);

    const shortID=
    order.id.slice(-8);

    document.getElementById("receiptContent").innerHTML=`

    <div class="receipt">

        <h2>AN NAM</h2>

        <div class="receipt-center">
        HÓA ĐƠN BÁN HÀNG
        <br>
        Mã: ${shortID}
        <br>
        ${date.toLocaleString("vi-VN")}
        </div>

        ${
        order.phone
        ?
        `<div>SĐT khách: ${order.phone}</div>`
        :""
        }

        ${
        order.customerName
        ?
        `<div>Khách: ${order.customerName}</div>`
        :""
        }

        <div class="receipt-line"></div>

        ${order.items.map(i=>`

            <div>
            <strong>${i.name}</strong>
            </div>

            <div class="row">
            <span>
            ${i.qty} x ${money(i.price)}
            </span>

            <span>
            ${money(i.qty*i.price)}
            </span>
            </div>

        `).join("")}

        <div class="receipt-line"></div>

        <div class="row">
        <span>Tạm tính</span>
        <strong>${money(order.subtotal)}</strong>
        </div>

        <div class="row">
        <span>Giảm giá</span>
        <strong>${money(order.discount)}</strong>
        </div>

        <div class="row">
        <strong>THANH TOÁN</strong>
        <strong style="font-size:20px">
        ${money(order.total)}
        </strong>
        </div>

        ${
        order.note
        ?
        `<div style="margin-top:12px">
        Ghi chú: ${order.note}
        </div>`
        :""
        }

        <div class="receipt-line"></div>

        <div class="receipt-center">
        Cảm ơn quý khách ❤️
        </div>

    </div>
    `;

    document
    .getElementById("receiptModal")
    .classList.add("show");
}

function closeReceipt(){

    document
    .getElementById("receiptModal")
    .classList.remove("show");
}


/* ==============================
   DANH SÁCH HÓA ĐƠN
================================ */

function renderOrders(){

    const q=
    document.getElementById("searchOrder")
    .value.toLowerCase();

    const list=
    orders.filter(o=>

        o.id.toLowerCase().includes(q)

        ||

        (o.phone||"")
        .toLowerCase()
        .includes(q)

    );

    document.getElementById("orderTable").innerHTML=

    list.length

    ?

    list.map(o=>`

    <tr>

        <td>
        ${o.id.slice(-8)}
        </td>

        <td>
        ${new Date(o.time).toLocaleString("vi-VN")}
        </td>

        <td>
        ${o.phone || o.customerName || "-"}
        </td>

        <td>
        <strong>${money(o.total)}</strong>
        </td>

        <td>
        <button
        class="action-btn primary"
        onclick="viewOrder('${o.id}')">
        Xem
        </button>
        </td>

    </tr>

    `).join("")

    :

    `<tr>
    <td colspan="5" class="empty">
    Chưa có hóa đơn.
    </td>
    </tr>`;
}

function viewOrder(id){

    const order=
    orders.find(o=>o.id===id);

    if(order)
        showReceipt(order);
}


/* ==============================
   QUẢN LÝ MÓN
================================ */

function addProduct(){

    const name=
    document.getElementById("newName")
    .value.trim();

    const price=
    Number(
        document.getElementById("newPrice")
        .value
    );

    const category=
    document.getElementById("newCategory")
    .value;

    if(!name || price<=0){

        alert("Nhập tên món và giá bán.");

        return;
    }

    products.push({

        id:Date.now(),

        name,

        price,

        category
    });

    save();

    document.getElementById("newName").value="";
    document.getElementById("newPrice").value="";

    renderProductTable();
    renderCategories();
    renderProducts();
}

function deleteProduct(id){

    if(!confirm("Xóa món này?"))
        return;

    products=
    products.filter(p=>p.id!==id);

    save();

    renderProductTable();
    renderCategories();
    renderProducts();
}

function editProduct(id){

    const p=
    products.find(x=>x.id===id);

    if(!p) return;

    const newName=
    prompt("Tên món:",p.name);

    if(newName===null)
        return;

    const newPrice=
    prompt("Giá bán:",p.price);

    if(newPrice===null)
        return;

    if(
        !newName.trim()
        ||
        Number(newPrice)<=0
    ){

        alert("Thông tin không hợp lệ.");

        return;
    }

    p.name=newName.trim();

    p.price=Number(newPrice);

    save();

    renderProductTable();
    renderProducts();
}

function renderProductTable(){

    document.getElementById("productTable")
    .innerHTML=

    products.map(p=>`

    <tr>

        <td>
        <strong>${p.name}</strong>
        </td>

        <td>
        ${p.category}
        </td>

        <td>
        ${money(p.price)}
        </td>

        <td>

        <button
        class="action-btn"
        onclick="editProduct(${p.id})">
        Sửa
        </button>

        <button
        class="action-btn danger"
        onclick="deleteProduct(${p.id})">
        Xóa
        </button>

        </td>

    </tr>

    `).join("");
}


/* ==============================
   KHÁCH HÀNG
================================ */

function getCustomers(){

    const map={};

    orders.forEach(o=>{

        if(!o.phone)
            return;

        if(!map[o.phone]){

            map[o.phone]={

                phone:o.phone,

                name:o.customerName || "",

                orders:0,

                spent:0
            };
        }

        map[o.phone].orders++;

        map[o.phone].spent+=o.total;

        if(o.customerName)
            map[o.phone].name=o.customerName;
    });

    return Object.values(map);
}

function renderCustomers(){

    const q=
    document.getElementById("searchCustomer")
    .value.toLowerCase();

    const customers=
    getCustomers()
    .filter(c=>

        c.phone.toLowerCase().includes(q)

        ||

        c.name.toLowerCase().includes(q)

    );

    document.getElementById("customerTable")
    .innerHTML=

    customers.length

    ?

    customers.map(c=>`

    <tr>

        <td>
        ${c.name || "Khách lẻ"}
        </td>

        <td>
        ${c.phone}
        </td>

        <td>
        ${c.orders}
        </td>

        <td>
        <strong>
        ${money(c.spent)}
        </strong>
        </td>

    </tr>

    `).join("")

    :

    `<tr>
    <td colspan="4" class="empty">
    Chưa có dữ liệu khách hàng.
    </td>
    </tr>`;
}


/* ==============================
   BÁO CÁO
================================ */

function renderReport(){

    const today=
    new Date().toLocaleDateString("vi-VN");

    const todayList=
    orders.filter(o=>

        new Date(o.time)
        .toLocaleDateString("vi-VN")
        === today
    );

    const todayRevenue=
    todayList.reduce(
        (s,o)=>s+o.total,
        0
    );

    const allRevenue=
    orders.reduce(
        (s,o)=>s+o.total,
        0
    );

    document.getElementById("todayRevenue")
    .textContent=money(todayRevenue);

    document.getElementById("todayOrders")
    .textContent=todayList.length;

    document.getElementById("allRevenue")
    .textContent=money(allRevenue);

    const sales={};

    orders.forEach(o=>{

        o.items.forEach(i=>{

            if(!sales[i.name])
                sales[i.name]=0;

            sales[i.name]+=i.qty;
        });
    });

    const sorted=
    Object.entries(sales)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

    document.getElementById("bestSeller")
    .innerHTML=

    sorted.length

    ?

    sorted.map(
        ([name,qty],index)=>`

        <div class="row"
        style="padding:10px 0;border-bottom:1px solid #eee">

        <span>
        ${index+1}. ${name}
        </span>

        <strong>
        ${qty} phần
        </strong>

        </div>

        `
    ).join("")

    :

    `<div class="empty">
    Chưa có dữ liệu bán hàng.
    </div>`;
}
